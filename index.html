<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parada Anual de Manutenção 26/27</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f2f4f7; --fg:#1a1d23; --card:#ffffff; --muted:#6b7280; --border:#e2e5ea;
  --accent:#2563eb; --planned:#94a3b8; --actual:#16a34a; --warn:#f59e0b;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#14161a;--fg:#e8eaed;--card:#1d2026;--muted:#9aa0a8;--border:#2b2f37;--planned:#556070;--actual:#22c55e;}
}
:root[data-theme="dark"]{--bg:#14161a;--fg:#e8eaed;--card:#1d2026;--muted:#9aa0a8;--border:#2b2f37;--planned:#556070;--actual:#22c55e;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:14px}
header{padding:14px 16px 10px;position:sticky;top:0;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--border);z-index:5}
h1{font-size:17px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px}
.wrap{max-width:1000px;margin:0 auto;padding:0 12px 24px}
.cards{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;flex:1;min-width:120px}
.card b{display:block;font-size:20px}
.card span{color:var(--muted);font-size:11px}
.charts{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.chartbox{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px}
.chartbox h3{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
svg{width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;position:sticky;top:56px;background:var(--bg);padding:6px 0;z-index:4}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tab{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:12px;white-space:nowrap;cursor:pointer}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
select,input[type=text],input[type=date]{background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12px}
input[type=text]{flex:1;min-width:220px;height:36px;font-size:13px}
.row{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.row .rowtop{display:flex;align-items:center;gap:8px}
.row .info{flex:1;min-width:0}
.row .name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:10.5px;color:var(--muted)}
.row input[type=range]{width:110px}
.row .pct{width:34px;text-align:right;font-size:12px;font-weight:600}
.row .obs{margin-top:6px;width:100%;font-size:11.5px;padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--fg)}
.obsRow{display:flex;gap:6px;margin-top:6px}
.obsRow .obs{flex:1;margin-top:0}
.fotoBtn{display:flex;align-items:center;justify-content:center;width:34px;height:30px;flex-shrink:0;border:1px solid var(--border);border-radius:6px;background:var(--bg);cursor:pointer;font-size:15px}
.fotoPrev{margin-top:6px;display:flex;align-items:center;gap:8px}
.fotoPrev img{max-width:90px;max-height:70px;border-radius:6px;border:1px solid var(--border);object-fit:cover}
.fotoRemove{font-size:10.5px;color:var(--muted);cursor:pointer}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--bg);border:1px solid var(--border);font-size:9.5px;margin-right:4px}
.actions{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.report-box{display:flex;gap:6px;margin:6px 0 14px}
.report-box input{flex:1}
button.primary{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer;white-space:nowrap}
button.primary:disabled{opacity:.6}
#list{padding-bottom:20px}
.count{color:var(--muted);font-size:11px;margin:4px 0 8px}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <h1>🛠️ Parada Anual de Manutenção 26/27</h1>
    <div class="sub">28/12/2026 a 11/01/2027 · 700 atividades · 3 líderes · 8 setores (dados de exemplo)</div>
  </div>
</header>
<div class="wrap">
  <div class="cards" id="cards"></div>

  <div class="charts">
    <div class="chartbox">
      <h3>Curva S Geral</h3>
      <svg id="chartGeral" viewBox="0 0 600 200"></svg>
      <div class="legend"><span><i style="background:var(--planned)"></i>Planejado</span><span><i style="background:var(--actual)"></i>Real</span></div>
    </div>
    <div class="chartbox">
      <h3>Curva S por Setor
        <select id="setorChartSel"></select>
      </h3>
      <svg id="chartSetor" viewBox="0 0 600 200"></svg>
      <div class="legend"><span><i style="background:var(--planned)"></i>Planejado</span><span><i style="background:var(--actual)"></i>Real</span></div>
    </div>
  </div>

  <div class="controls">
    <div class="tabs" id="tabsLider"></div>
  </div>
  <div class="controls">
    <select id="setorFiltro"></select>
    <input type="text" id="busca" placeholder="🔎 Pesquisar atividades por nome, setor, líder ou palavra-chave..." aria-label="Pesquisar atividades">
  </div>
  <div class="actions">
    <div class="count" id="count"></div>
  </div>
  <div class="report-box">
    <button class="primary" id="relatorioBtn">🖨️ Gerar PDF do relatório</button>
  </div>

  <div id="list"></div>
</div>

<script>
const TOTAL=700, DIAS=15;
const START=new Date(2026,11,28);
const SETORES=["Mecânica","Elétrica","Instrumentação","Processo","Civil","Segurança","Utilidades","Tubulação"];
const LIDERES=["Líder A","Líder B","Líder C"];
const VERBOS=["Inspeção","Lubrificação","Substituição de componente","Calibração","Reaperto","Limpeza","Troca de vedação","Verificação","Alinhamento","Teste funcional"];

function smoothstep(t){return t*t*(3-2*t);}

let atividades=[];
for(let i=1;i<=TOTAL;i++){
  const t=i/TOTAL;
  const dia=Math.max(1,Math.min(DIAS,Math.round(1+(DIAS-1)*smoothstep(t))));
  const setor=SETORES[(i*37+13)%8];
  const lider=LIDERES[(i*13+5)%3];
  const verbo=VERBOS[(i*7+3)%VERBOS.length];
  atividades.push({id:i,nome:`Atividade ${String(i).padStart(4,'0')} - ${verbo} (${setor})`,setor,lider,dia,pct:0,obs:"",acao:"",foto:null});
}

let progresso={};
try{ progresso=JSON.parse(localStorage.getItem('parada2627_progresso')||'{}'); }catch(e){ progresso={}; }
atividades.forEach(a=>{
  const p=progresso[a.id];
  if(p!==undefined){
    a.pct = typeof p==='object' ? (p.pct||0) : p;
    a.obs = (typeof p==='object' && p.obs) ? p.obs : "";
    a.foto = (typeof p==='object' && p.foto) ? p.foto : null;
    a.acao = (typeof p==='object' && p.acao) ? p.acao : "";
  }
});

function salvar(){
  try{
    const obj={}; atividades.forEach(a=>obj[a.id]={pct:a.pct,obs:a.obs,acao:a.acao,foto:a.foto});
    localStorage.setItem('parada2627_progresso',JSON.stringify(obj));
  }catch(e){
    if(!window.__avisoStorage){
      window.__avisoStorage=true;
      alert('Armazenamento local cheio (muitas fotos). Algumas alterações podem não ser salvas - considere remover fotos antigas.');
    }
  }
}

let filtroLider="Todos", filtroSetor="Todos", busca="";

function popularSelects(){
  const selFiltro=document.getElementById('setorFiltro');
  selFiltro.innerHTML='<option>Todos</option>'+SETORES.map(s=>`<option>${s}</option>`).join('');
  selFiltro.onchange=()=>{filtroSetor=selFiltro.value; renderLista();};

  const selChart=document.getElementById('setorChartSel');
  selChart.innerHTML='<option>Geral</option>'+SETORES.map(s=>`<option>${s}</option>`).join('');
  selChart.onchange=()=>desenharSetorChart(selChart.value);

  const tabs=document.getElementById('tabsLider');
  const opts=["Todos",...LIDERES];
  tabs.innerHTML=opts.map(l=>`<div class="tab ${l===filtroLider?'active':''}" data-l="${l}">${l}</div>`).join('');
  tabs.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    filtroLider=t.dataset.l;
    tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    renderLista();
  });

  document.getElementById('busca').oninput=(e)=>{busca=e.target.value.toLowerCase(); renderLista();};
  document.getElementById('relatorioBtn').onclick=gerarRelatorioPDF;
}

function filtrados(){
  return atividades.filter(a=>
    (filtroLider==="Todos"||a.lider===filtroLider) &&
    (filtroSetor==="Todos"||a.setor===filtroSetor) &&
    (busca===""||[a.nome,a.setor,a.lider,a.id,String(a.dia),a.obs,a.acao].join(" ").toLowerCase().includes(busca))
  );
}

function renderLista(){
  const arr=filtrados();
  document.getElementById('count').textContent=`${arr.length} atividades exibidas`;
  document.getElementById('list').innerHTML=arr.map(a=>`
    <div class="row" data-id="${a.id}">
      <div class="rowtop">
        <div class="info">
          <div class="name">${a.nome}</div>
          <div class="meta"><span class="tag">${a.lider}</span><span class="tag">${a.setor}</span>Dia ${a.dia}</div>
        </div>
        <input type="range" min="0" max="100" value="${a.pct}" data-id="${a.id}">
        <div class="pct" data-pctfor="${a.id}">${a.pct}%</div>
      </div>
      <div class="obsRow">
        <input type="text" class="obs" data-obsid="${a.id}" placeholder="Observações..." value="${(a.obs||'').replace(/"/g,'&quot;')}">
        <input type="text" class="obs" data-acaoid="${a.id}" placeholder="Ação / encaminhamento..." value="${(a.acao||'').replace(/"/g,'&quot;')}">
        <label class="fotoBtn">📷<input type="file" accept="image/*" capture="environment" class="fotoInput" data-fotoid="${a.id}" hidden></label>
      </div>
      ${a.foto?`<div class="fotoPrev"><img src="${a.foto}"><span class="fotoRemove" data-rmid="${a.id}">✕ remover foto</span></div>`:''}
    </div>`).join('');
}

document.getElementById('list').addEventListener('input',(e)=>{
  if(e.target.matches('input[type=range]')){
    const id=+e.target.dataset.id;
    const a=atividades.find(x=>x.id===id);
    a.pct=+e.target.value;
    document.querySelector(`[data-pctfor="${id}"]`).textContent=a.pct+'%';
    salvar();
    atualizarTudo();
  } else if(e.target.matches('.obs')){
    const id=+(e.target.dataset.obsid || e.target.dataset.acaoid);
    const a=atividades.find(x=>x.id===id);
    if(e.target.dataset.obsid) a.obs=e.target.value;
    if(e.target.dataset.acaoid) a.acao=e.target.value;
    salvar();
  }
});

document.getElementById('list').addEventListener('change',(e)=>{
  if(e.target.matches('.fotoInput')){
    const id=+e.target.dataset.fotoid;
    const file=e.target.files[0];
    if(file) processarFoto(file,id);
  }
});

document.getElementById('list').addEventListener('click',(e)=>{
  if(e.target.matches('.fotoRemove')){
    const id=+e.target.dataset.rmid;
    const a=atividades.find(x=>x.id===id);
    a.foto=null; salvar(); renderLista();
  }
});

function processarFoto(file,id){
  const reader=new FileReader();
  reader.onload=(ev)=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=480;
      const scale=Math.min(1,maxW/img.width);
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*scale); canvas.height=Math.round(img.height*scale);
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl=canvas.toDataURL('image/jpeg',0.6);
      const a=atividades.find(x=>x.id===id);
      a.foto=dataUrl;
      salvar();
      renderLista();
    };
    img.onerror=()=>alert('Não foi possível processar essa imagem.');
    img.src=ev.target.result;
  };
  reader.onerror=()=>alert('Não foi possível ler essa imagem.');
  reader.readAsDataURL(file);
}

function curvas(lista){
  const planned=[0], actual=[0];
  const n=lista.length||1;
  for(let d=1;d<=DIAS;d++){
    const noDia=lista.filter(a=>a.dia<=d);
    planned.push(noDia.length/n*100);
    actual.push(noDia.reduce((s,a)=>s+a.pct,0)/n);
  }
  return {planned,actual};
}

function path(vals,W,H,pad){
  const max=100, n=vals.length-1;
  return vals.map((v,i)=>{
    const x=pad+(i/n)*(W-2*pad);
    const y=H-pad-(v/max)*(H-2*pad);
    return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
}

function desenharChart(svgEl,lista){
  const W=600,H=200,pad=24;
  const {planned,actual}=curvas(lista);
  let axis='';
  for(let g=0;g<=4;g++){
    const y=pad+g*(H-2*pad)/4;
    axis+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
  }
  svgEl.innerHTML=axis+
    `<path d="${path(planned,W,H,pad)}" fill="none" stroke="var(--planned)" stroke-width="2" stroke-dasharray="4,3"/>`+
    `<path d="${path(actual,W,H,pad)}" fill="none" stroke="var(--actual)" stroke-width="2.5"/>`;
}

function desenharSetorChart(setor){
  const lista = setor==="Geral" ? atividades : atividades.filter(a=>a.setor===setor);
  desenharChart(document.getElementById('chartSetor'), lista);
}

function atualizarTudo(){
  desenharChart(document.getElementById('chartGeral'), atividades);
  desenharSetorChart(document.getElementById('setorChartSel').value||"Geral");

  const geral=atividades.reduce((s,a)=>s+a.pct,0)/TOTAL;
  const porLider=LIDERES.map(l=>{
    const arr=atividades.filter(a=>a.lider===l);
    return {l, pct:(arr.reduce((s,a)=>s+a.pct,0)/arr.length).toFixed(1)};
  });
  const concluidas=atividades.filter(a=>a.pct>=100).length;

  document.getElementById('cards').innerHTML=
    `<div class="card"><b>${geral.toFixed(1)}%</b><span>Progresso geral</span></div>`+
    porLider.map(x=>`<div class="card"><b>${x.pct}%</b><span>${x.l}</span></div>`).join('')+
    `<div class="card"><b>${concluidas}/${TOTAL}</b><span>Concluídas</span></div>`;
}

function svgParaPngDataUrl(svgEl,w,h){
  return new Promise((resolve)=>{
    try{
      const clone=svgEl.cloneNode(true);
      // O SVG da tela usa variáveis CSS; elas não existem quando o SVG é
      // carregado como imagem no PDF. Substituímos por cores fixas.
      clone.querySelectorAll('[stroke=\"var(--planned)\"]').forEach(el=>el.setAttribute('stroke','#94a3b8'));
      clone.querySelectorAll('[stroke=\"var(--actual)\"]').forEach(el=>el.setAttribute('stroke','#16a34a'));
      clone.querySelectorAll('[stroke=\"var(--border)\"]').forEach(el=>el.setAttribute('stroke','#e2e5ea'));
      clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
      const xml=new XMLSerializer().serializeToString(clone);
      const svg64=btoa(unescape(encodeURIComponent(xml)));
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror=()=>resolve(null);
      img.src='data:image/svg+xml;base64,'+svg64;
    }catch(e){ resolve(null); }
  });
}

function curvaCanvasDataUrl(lista, titulo){
  const canvas=document.createElement('canvas');
  canvas.width=1200; canvas.height=500;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  const {planned,actual}=curvas(lista);
  const L=80,R=35,T=55,B=65,W=canvas.width,H=canvas.height;
  ctx.strokeStyle='#e2e5ea'; ctx.lineWidth=1;
  ctx.fillStyle='#1a1d23'; ctx.font='bold 24px Arial'; ctx.fillText(titulo,L,T-18);
  ctx.font='16px Arial'; ctx.fillStyle='#6b7280';
  for(let g=0;g<=4;g++){
    const y=T+g*(H-T-B)/4;
    ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(W-R,y); ctx.stroke();
    ctx.fillText(String(100-g*25)+'%',18,y+6);
  }
  for(let d=0;d<=DIAS;d++){
    const x=L+(d/DIAS)*(W-L-R);
    if(d>0 && d<DIAS){ctx.strokeStyle='#f1f3f5';ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,H-B);ctx.stroke();ctx.strokeStyle='#e2e5ea';}
    ctx.fillStyle='#6b7280'; ctx.font='14px Arial'; ctx.fillText('D'+d,x-8,H-B+28);
  }
  function draw(vals,color,width,dash){
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.setLineDash(dash||[]); ctx.beginPath();
    vals.forEach((v,i)=>{const x=L+(i/DIAS)*(W-L-R);const y=H-B-(v/100)*(H-T-B);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
    ctx.stroke(); ctx.setLineDash([]);
  }
  draw(planned,'#94a3b8',4,[10,7]);
  draw(actual,'#16a34a',5,[]);
  ctx.font='16px Arial'; ctx.fillStyle='#6b7280';
  ctx.fillRect(L,H-27,36,4); ctx.fillText('Planejado',L+45,H-20);
  ctx.fillStyle='#16a34a'; ctx.fillRect(L+145,H-27,36,4); ctx.fillText('Real',L+190,H-20);
  return canvas.toDataURL('image/png');
}

async function gerarRelatorioPDF(){
  const btn=document.getElementById('relatorioBtn');
  const textoOrig=btn.textContent;
  const arr=filtrados();

  if(!arr.length){
    alert('Nenhuma atividade encontrada para gerar o relatório.');
    return;
  }

  btn.textContent='Gerando PDF...';
  btn.disabled=true;

  try{
    if(!window.jspdf){
      alert('A biblioteca de PDF não carregou. Verifique sua conexão e tente novamente.');
      return;
    }

    const {jsPDF}=window.jspdf;

    // Relatório em A4 paisagem, inspirado em uma ficha técnica:
    // uma atividade por página, sem truncar observações ou nomes.
    const doc=new jsPDF({unit:'mm',format:'a4',orientation:'landscape'});
    const pageW=doc.internal.pageSize.getWidth();
    const pageH=doc.internal.pageSize.getHeight();
    const M=10;

    function safeText(v){
      return String(v??'')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');
    }

    function wrapText(text,maxWidth,fontSize=9,fontStyle='normal'){
      doc.setFont('helvetica',fontStyle);
      doc.setFontSize(fontSize);
      return doc.splitTextToSize(String(text||''),maxWidth);
    }

    function addPageFrame(){
      doc.setDrawColor(150,150,150);
      doc.setLineWidth(0.35);
      doc.rect(M,M,pageW-2*M,pageH-2*M);

      // Marcações laterais superiores/inferiores, remetendo ao padrão de folha técnica.
      doc.setFont('helvetica','normal');
      doc.setFontSize(6);
      const n=12;
      const step=(pageW-2*M)/n;
      for(let i=0;i<=n;i++){
        const x=M+i*step;
        doc.line(x,M,x,M+2.5);
        doc.line(x,pageH-M,x,pageH-M-2.5);
        if(i<n){
          doc.text(String(n-i),x+step/2,pageH-M+5,{align:'center'});
        }
      }
    }

    function header(activity){
      doc.setFont('helvetica','bold');
      doc.setFontSize(15);
      doc.setTextColor(20,25,30);
      doc.text('PARADA ANUAL DE MANUTENÇÃO 26/27',M+7,M+9);

      doc.setFont('helvetica','normal');
      doc.setFontSize(7.5);
      doc.setTextColor(90,95,100);
      doc.text('28/12/2026 a 11/01/2027',M+7,M+14);

      // ID no canto direito
      doc.setFont('helvetica','bold');
      doc.setFontSize(9);
      doc.setTextColor(30,30,30);
      doc.text('ATIVIDADE '+String(activity.id).padStart(4,'0'),pageW-M-7,M+9,{align:'right'});
      doc.setFont('helvetica','normal');
      doc.setFontSize(7);
      doc.text('Gerado em '+new Date().toLocaleString('pt-BR'),pageW-M-7,M+14,{align:'right'});

      doc.setDrawColor(80,80,80);
      doc.setLineWidth(0.5);
      doc.line(M+7,M+18,pageW-M-7,M+18);
    }

    function sectionTitle(title,x,y,w){
      doc.setFillColor(238,240,242);
      doc.setDrawColor(170,170,170);
      doc.rect(x,y,w,7,'FD');
      doc.setFont('helvetica','bold');
      doc.setFontSize(8);
      doc.setTextColor(30,30,30);
      doc.text(title,x+3,y+4.7);
    }

    function metadata(activity){
      const x=M+7, y=M+23, w=pageW-2*(M+7), gap=3;
      const widths=[w*0.43,w*0.16,w*0.16,w*0.10,w*0.15-gap*4];
      const vals=[
        ['ATIVIDADE',activity.nome],
        ['SETOR',activity.setor],
        ['LÍDER',activity.lider],
        ['DIA',String(activity.dia)],
        ['PROGRESSO',activity.pct+'%']
      ];

      let xx=x;
      vals.forEach((v,i)=>{
        const ww=widths[i];
        doc.setDrawColor(175,175,175);
        doc.setFillColor(250,250,250);
        doc.rect(xx,y,ww,18,'FD');

        doc.setFont('helvetica','bold');
        doc.setFontSize(6.5);
        doc.setTextColor(90,90,90);
        doc.text(v[0],xx+2.5,y+4);

        doc.setFont('helvetica',i===4?'bold':'normal');
        doc.setFontSize(i===0?8:9);
        doc.setTextColor(20,20,20);
        const lines=wrapText(v[1],ww-5,i===0?8:9,i===4?'bold':'normal');
        doc.text(lines.slice(0,2),xx+2.5,y+9);
        xx+=ww+gap;
      });

      // barra de progresso
      const barY=y+21, barW=w, barH=5;
      doc.setDrawColor(170,170,170);
      doc.setFillColor(235,235,235);
      doc.rect(x,barY,barW,barH,'FD');
      doc.setFillColor(37,99,235);
      doc.rect(x,barY,Math.max(0,Math.min(100,activity.pct))/100*barW,barH,'F');
      doc.setFont('helvetica','bold');
      doc.setFontSize(6.5);
      doc.setTextColor(30,30,30);
      doc.text(activity.pct+'% concluído',x+barW/2,barY+3.7,{align:'center'});
    }

    function addObservation(activity,x,y,w,h){
      sectionTitle('OBSERVAÇÕES / REGISTRO DA ATIVIDADE',x,y,w);
      const bodyY=y+7;
      doc.setDrawColor(175,175,175);
      doc.setFillColor(255,255,255);
      doc.rect(x,bodyY,w,h,'FD');

      const obs=(activity.obs||'').trim();
      doc.setFont('helvetica','normal');
      doc.setFontSize(9);
      doc.setTextColor(25,25,25);

      if(!obs){
        doc.setTextColor(145,145,145);
        doc.text('Nenhuma observação registrada.',x+4,bodyY+8);
      }else{
        const lines=wrapText(obs,w-8,9,'normal');
        doc.text(lines,x+4,bodyY+8,{lineHeightFactor:1.35});
      }
    }

    function addPhoto(activity,x,y,w,h){
      sectionTitle('REGISTRO FOTOGRÁFICO',x,y,w);
      const bodyY=y+7;
      doc.setDrawColor(175,175,175);
      doc.setFillColor(250,250,250);
      doc.rect(x,bodyY,w,h,'FD');

      if(!activity.foto){
        doc.setFont('helvetica','normal');
        doc.setFontSize(9);
        doc.setTextColor(145,145,145);
        doc.text('Nenhuma imagem anexada a esta atividade.',x+w/2,bodyY+h/2,{align:'center'});
        return Promise.resolve();
      }

      // A foto já é armazenada como DataURL no cadastro da atividade.
      // Primeiro tentamos inserir diretamente no jsPDF; depois usamos Image
      // como fallback para navegadores que exigem a imagem carregada.
      return new Promise(resolve=>{
        const data=activity.foto;
        const format = data.indexOf('image/png')>=0 ? 'PNG' : 'JPEG';
        try{
          const img=new Image();
          img.onload=()=>{
            try{
              const iw=img.naturalWidth||img.width||1;
              const ih=img.naturalHeight||img.height||1;
              const scale=Math.min((w-8)/iw,(h-8)/ih);
              const dw=iw*scale, dh=ih*scale;
              const dx=x+(w-dw)/2, dy=bodyY+(h-dh)/2;
              doc.addImage(data,format,dx,dy,dw,dh,undefined,'FAST');
            }catch(e){
              try{
                doc.addImage(data,format,x+4,bodyY+4,w-8,h-8,undefined,'FAST');
              }catch(_){
                doc.setFont('helvetica','normal');
                doc.setFontSize(8);
                doc.setTextColor(170,50,50);
                doc.text('Não foi possível inserir a imagem.',x+w/2,bodyY+h/2,{align:'center'});
              }
            }
            resolve();
          };
          img.onerror=()=>{
            try{
              doc.addImage(data,format,x+4,bodyY+4,w-8,h-8,undefined,'FAST');
            }catch(_){
              doc.setFont('helvetica','normal');
              doc.setFontSize(8);
              doc.setTextColor(170,50,50);
              doc.text('Imagem anexada, mas não pôde ser inserida no PDF.',x+w/2,bodyY+h/2,{align:'center'});
            }
            resolve();
          };
          img.src=data;
        }catch(e){
          try{ doc.addImage(data,format,x+4,bodyY+4,w-8,h-8,undefined,'FAST'); }catch(_){}
          resolve();
        }
      });
    }

    function footer(){
      const y=pageH-M-5;
      doc.setFont('helvetica','normal');
      doc.setFontSize(6.5);
      doc.setTextColor(110,110,110);
      doc.text('Documento de acompanhamento da Parada Anual de Manutenção 26/27',M+7,y);
      doc.text('Página '+doc.getNumberOfPages(),pageW-M-7,y,{align:'right'});
    }

    // Capa/resumo
    addPageFrame();
    doc.setFont('helvetica','bold');
    doc.setFontSize(20);
    doc.setTextColor(20,25,30);
    doc.text('RELATÓRIO DE ACOMPANHAMENTO',M+10,35);
    doc.setFontSize(15);
    doc.text('PARADA ANUAL DE MANUTENÇÃO 26/27',M+10,44);

    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    doc.setTextColor(80,80,80);
    doc.text('Período: 28/12/2026 a 11/01/2027',M+10,51);
    doc.text('Atividades incluídas no relatório: '+arr.length,M+10,57);

    sectionTitle('CRITÉRIOS UTILIZADOS',M+10,68,pageW-2*M-20);
    let cy=78;
    const criterios=[
      `Filtro de líder: ${filtroLider}`,
      `Filtro de setor: ${filtroSetor}`,
      `Pesquisa: ${busca.trim() ? busca : 'Sem pesquisa'}`,
      `Progresso geral do conjunto selecionado: ${(arr.reduce((s,a)=>s+a.pct,0)/arr.length).toFixed(1)}%`,
      `Atividades concluídas: ${arr.filter(a=>a.pct>=100).length}/${arr.length}`,
      `Atividades com observação: ${arr.filter(a=>a.obs&&a.obs.trim()).length}`,
      `Atividades com imagem: ${arr.filter(a=>a.foto).length}`
    ];
    doc.setFontSize(10);
    criterios.forEach(t=>{
      doc.text('• '+t,M+14,cy); cy+=8;
    });

    sectionTitle('OBSERVAÇÃO',M+10,cy+7,pageW-2*M-20);
    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    doc.text(wrapText('As páginas seguintes apresentam uma ficha individual para cada atividade, mantendo integralmente as informações cadastradas, observações e imagens anexadas.',pageW-2*M-28,9),M+14,cy+17,{lineHeightFactor:1.4});
    footer();

    // Curvas S no PDF: geradas diretamente em Canvas para não depender
    // das variáveis CSS do SVG da tela.
    const curvaGeral = curvaCanvasDataUrl(arr, 'Curva S Geral - Planejado x Real');
    doc.addPage();
    addPageFrame();
    doc.setFont('helvetica','bold');
    doc.setFontSize(16);
    doc.setTextColor(20,25,30);
    doc.text('CURVA S GERAL',M+10,25);
    doc.setFont('helvetica','normal');
    doc.setFontSize(8);
    doc.setTextColor(90,95,100);
    doc.text('Conjunto de atividades considerado neste relatório',M+10,31);
    doc.addImage(curvaGeral,'PNG',M+10,40,pageW-2*M-20,105,undefined,'FAST');
    footer();

    const setorSelecionado = document.getElementById('setorChartSel').value || 'Geral';
    const listaSetor = setorSelecionado==='Geral' ? arr : arr.filter(a=>a.setor===setorSelecionado);
    const curvaSetor = curvaCanvasDataUrl(listaSetor.length ? listaSetor : arr, 'Curva S por Setor - '+setorSelecionado);
    doc.addPage();
    addPageFrame();
    doc.setFont('helvetica','bold');
    doc.setFontSize(16);
    doc.setTextColor(20,25,30);
    doc.text('CURVA S POR SETOR',M+10,25);
    doc.setFont('helvetica','normal');
    doc.setFontSize(8);
    doc.setTextColor(90,95,100);
    doc.text('Setor selecionado: '+setorSelecionado,M+10,31);
    doc.addImage(curvaSetor,'PNG',M+10,40,pageW-2*M-20,105,undefined,'FAST');
    footer();

    // Uma ficha completa por atividade
    for(let idx=0;idx<arr.length;idx++){
      const a=arr[idx];
      doc.addPage();
      addPageFrame();
      header(a);
      metadata(a);

      // Layout em duas colunas: foto grande + observações completas.
      const x=M+7;
      const totalW=pageW-2*(M+7);
      const gap=5;
      const leftW=totalW*0.54;
      const rightW=totalW-leftW-gap;
      const topY=M+68;

      await addPhoto(a,x,topY,leftW,92);
      addObservation(a,x+leftW+gap,topY,rightW,92);

      sectionTitle('INFORMAÇÕES DA ATIVIDADE',x,topY+104,totalW);
      const infoY=topY+111;
      doc.setFont('helvetica','normal');
      doc.setFontSize(8.5);
      doc.setTextColor(35,35,35);

      const info=[
        ['ID',String(a.id).padStart(4,'0')],
        ['Atividade',a.nome],
        ['Setor',a.setor],
        ['Líder',a.lider],
        ['Dia programado',String(a.dia)],
        ['Percentual executado',a.pct+'%']
      ];

      let iy=infoY;
      info.forEach(([label,val])=>{
        doc.setFont('helvetica','bold');
        doc.text(label+':',x,iy);
        doc.setFont('helvetica','normal');
        const lines=wrapText(val,totalW-42,8.5,'normal');
        doc.text(lines,x+42,iy,{lineHeightFactor:1.3});
        iy += Math.max(6,lines.length*5.2);
      });

      sectionTitle('CONTROLE / STATUS',x,iy+4,totalW);
      doc.setFont('helvetica','normal');
      doc.setFontSize(8.5);
      doc.text(
        `Status: ${a.pct>=100?'CONCLUÍDA':a.pct>0?'EM EXECUÇÃO':'NÃO INICIADA'}    |    Líder responsável: ${a.lider}    |    Setor: ${a.setor}`,
        x,iy+16
      );

      footer();
    }

    doc.save('relatorio-parada-26-27-completo.pdf');
  }catch(e){
    console.error(e);
    alert('Não foi possível gerar o PDF completo. Tente novamente em um navegador atualizado.');
  }finally{
    btn.textContent=textoOrig;
    btn.disabled=false;
  }
}

popularSelects();
renderLista();
atualizarTudo();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCak5Xf4cBJu4oYiwCdqdH38yD2pYsseGY",
  authDomain: "app-grande-parada.firebaseapp.com",
  projectId: "app-grande-parada",
  storageBucket: "app-grande-parada.firebasestorage.app",
  messagingSenderId: "14079799224",
  appId: "1:14079799224:web:7a0e4ee913cf47af5ee94d"
};

const db = getFirestore(initializeApp(firebaseConfig));
const COL = "atividades";

const snap = a => JSON.stringify({pct:a.pct, obs:a.obs, acao:a.acao, foto:a.foto});
const ult = {};                                   // último estado sincronizado de cada atividade
atividades.forEach(a => ult[a.id] = snap(a));

const status = document.createElement('span');
document.querySelector('.sub').appendChild(status);
const setStatus = t => status.textContent = ' · ' + t;
setStatus('conectando...');

// ---- ENVIAR: mantém o salvar() original (localStorage) e acrescenta o envio ao Firestore
const salvarLocal = window.salvar;
let timer = null;
window.salvar = function(){
  salvarLocal();
  clearTimeout(timer);
  timer = setTimeout(enviar, 700);                // agrupa os movimentos do slider/digitação
};
function enviar(){
  atividades.forEach(a => {
    const s = snap(a);
    if (s === ult[a.id]) return;
    ult[a.id] = s;
    setDoc(doc(db, COL, String(a.id)), {
      pct:a.pct, obs:a.obs, acao:a.acao, foto:a.foto,
      lider:a.lider, setor:a.setor, dia:a.dia,
      atualizadoEm: serverTimestamp()
    }, {merge:true}).catch(e => { ult[a.id] = null; console.error(e); setStatus('⚠️ erro ao salvar na nuvem'); });
  });
}

// ---- RECEBER: atualiza a tela em tempo real quando outra pessoa altera algo
onSnapshot(collection(db, COL), qs => {
  let mudou = false, fotoMudou = false;
  qs.docChanges().forEach(ch => {
    if (ch.doc.metadata.hasPendingWrites) return; // alteração feita por este próprio aparelho
    const a = atividades.find(x => x.id === +ch.doc.id);
    if (!a) return;
    const d = ch.doc.data();
    const novo = {pct:d.pct||0, obs:d.obs||'', acao:d.acao||'', foto:d.foto||null};
    if (JSON.stringify(novo) === ult[a.id]) return;
    if (novo.foto !== a.foto) fotoMudou = true;
    Object.assign(a, novo);
    ult[a.id] = snap(a);
    mudou = true;

    const row = document.querySelector(`.row[data-id="${a.id}"]`);
    if (row){
      row.querySelector('input[type=range]').value = a.pct;
      row.querySelector('.pct').textContent = a.pct + '%';
      const o = row.querySelector('[data-obsid]'), c = row.querySelector('[data-acaoid]');
      if (o !== document.activeElement) o.value = a.obs;
      if (c !== document.activeElement) c.value = a.acao;
    }
  });
  if (mudou){
    salvarLocal();
    atualizarTudo();
    if (fotoMudou && !(document.activeElement && document.activeElement.matches('.obs'))) renderLista();
  }
  setStatus('☁️ sincronizado');
}, err => { console.error(err); setStatus('⚠️ sem conexão com a nuvem (salvando só neste aparelho)'); });
</script>
